name: 'Sage Graph Sync'
# CHANGE HERE: Short tagline shown in GitHub Marketplace search (< 160 chars)
description: 'Autonomous Git and GitHub decision graph sync powered by embedded Sqlite'
# CHANGE HERE: Publisher or author name shown on GitHub Marketplace
author: 'diamondosas'

branding:
  # CHANGE HERE: Feather icon name (e.g. cpu, bookmark, git-commit, search, zap)
  icon: 'cpu'
  # CHANGE HERE: Badge background color (white, yellow, blue, green, orange, red, purple, gray-dark)
  color: 'purple'

inputs:
  github_token:
    description: 'GitHub token for fetching PR discussions and linked issues'
    required: false
    # CHANGE HERE: Defaults to runner ephemeral token
    default: ${{ github.token }}
  llm_provider:
    description: 'LLM provider for decision summarization (google, openai, anthropic, ollama)'
    required: false
    # CHANGE HERE: Change default provider ('google', 'openai', etc.)
    default: 'google'
  llm_api_key:
    description: 'API key for Gemini, Groq, or OpenAI decision summarization (optional)'
    required: false
    default: ''
  max_commits:
    description: 'Maximum recent commits to scan'
    required: false
    # CHANGE HERE: Increase or decrease commit scan depth
    default: '500'

runs:
  using: 'composite'
  steps:
    - name: Install Sage
      shell: bash
      run: |
        if command -v sage >/dev/null 2>&1; then
          echo "Sage already available on PATH"
        elif [ -f "./install/install.sh" ]; then
          bash ./install/install.sh
        else
          # CHANGE HERE: Repository slug for release binary download
          curl -fsSL https://raw.githubusercontent.com/diamondosas/sage/main/install/install.sh | bash
        fi

    - name: Run Sage Sync
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LLM_PROVIDER: ${{ inputs.llm_provider }}
        GEMINI_API_KEY: ${{ inputs.llm_api_key }}
        GROQ_API_KEY: ${{ inputs.llm_api_key }}
        OPENAI_API_KEY: ${{ inputs.llm_api_key }}
        SAGE_MAX_COMMITS: ${{ inputs.max_commits }}
      run: |
        sage sync
