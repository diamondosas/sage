name: Build Linux Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (amd64 & arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # CHANGE HERE: Set CGO_ENABLED=0 for fully static Linux binaries
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -v -o dist/sage-linux-amd64 ./cmd/sage

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -v -o dist/sage-linux-arm64 ./cmd/sage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sage-linux
          path: dist/
