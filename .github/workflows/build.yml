name: Build & Test (All Platforms)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # CHANGE HERE: Add more OS runners or architectures if needed (e.g., [ubuntu-latest, macos-latest, windows-latest])
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # CHANGE HERE: Point to a specific Go version string (e.g. '1.23') instead of go-version-file if desired
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit tests
        run: go test -v ./...

      - name: Build binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: go build -v -o bin/sage ./cmd/sage

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: go build -v -o bin/sage.exe ./cmd/sage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-${{ matrix.os }}
          path: bin/
